name: build-deb

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # нужно только для публикации релиза по тегу

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install ldid and dpkg
        run: brew install ldid dpkg

      - name: Build .deb package
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: slashlib-deb
          path: build/*.deb
          if-no-files-found: error
          retention-days: 30

      # Если запушить тег вида v0.3.0 — .deb появится в разделе Releases.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
